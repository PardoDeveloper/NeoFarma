# Despliegue completo en contenedores (Podman o Docker): Postgres propio + API + web.
# Uso: podman compose up -d --build   →   http://localhost:8081
# Nota: usa su propio Postgres (volumen neofarma-db), independiente del Postgres nativo del host.
name: neofarma

services:
  db:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: neo_farma
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cambiar-esta-clave}
    volumes:
      - neofarma-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d neo_farma"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build: ./backend
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://admin:${POSTGRES_PASSWORD:-cambiar-esta-clave}@db:5432/neo_farma?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET en .env}
      JWT_TTL: 12h
      CORS_ORIGINS: http://localhost:8081
      AUTO_MIGRATE: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  neofarma-db:
